# ai-router 配置样例（v2：多模型 + 场景路由）。复制为 config.yaml 并填入真实 API Key。
# 端点已核实（2026-09）：修改模型名/上游名前请对照各厂商当前文档。

server:
  host: 127.0.0.1
  port: 3456

# 接入 Key -> 项目标签。值为 null 表示用 system prompt 里的工作目录自动推断。
accessKeys:
  sk-router-homepage: homepage
  sk-router-backend: backend-api
  sk-router-default: null

# providers.<厂商>.models: 本地别名 -> { upstream: 上游真实模型名, contextWindow: 上下文窗口 }
# 别名为路由规则中引用的名字；upstream 为发给厂商 API 的 model 字段。
providers:
  # Kimi / Moonshot
  kimi:
    baseUrl: https://api.moonshot.cn/anthropic
    apiKey: sk-your-moonshot-key
    authHeader: bearer
    userAgent: claude-cli/2.0.14 (external, cli)
    models:
      k3-1m:           { upstream: k3, contextWindow: 1048576 }              # 1M 版模型 ID 为 k3（1M 上下文需 Allegretto/Pro 及以上会员）
      k3:              { upstream: k3-256k, contextWindow: 262144 }
      kimi-for-coding: { upstream: kimi-for-coding, contextWindow: 262144 }

  # 火山方舟 Coding Plan（模型可换 ark-code-latest 等，对照当前文档）
  volcengine:
    baseUrl: https://ark.cn-beijing.volces.com/api/coding
    apiKey: your-ark-coding-plan-key
    authHeader: bearer
    userAgent: claude-cli/2.0.14 (external, cli)
    models:
      glm-5.3:       { upstream: glm-5.3, contextWindow: 262144 }
      glm-5.3-flash: { upstream: glm-5.3-flash, contextWindow: 262144 }

  # 阿里百炼 Coding Plan（压缩工作首选，便宜）
  bailian:
    baseUrl: https://coding.dashscope.aliyuncs.com/apps/anthropic
    apiKey: sk-your-dashscope-coding-plan-key
    authHeader: bearer
    userAgent: claude-cli/2.0.14 (external, cli)
    models:
      glm-5: { upstream: glm-5, contextWindow: 262144 }

routing:
  # key = Claude Code 发来的模型名，"*" 为兜底（必填）；链元素为 "厂商/模型别名"，按序 failover
  rules:
    claude-opus-4-6:   [kimi/k3-1m, volcengine/glm-5.3, bailian/glm-5]
    claude-sonnet-4-6: [kimi/kimi-for-coding, volcengine/glm-5.3, bailian/glm-5]
    claude-haiku-4-5:  [volcengine/glm-5.3-flash, bailian/glm-5]
    "*":               [kimi/kimi-for-coding, volcengine/glm-5.3, bailian/glm-5]

compact:
  thresholdRatio: 0.85     # 上下文 > 目标窗口 × 此值时触发压缩
  targetRatio: 0.7         # 压缩后期望降到目标窗口 × 此值
  keepRecentTurns: 6       # 最近 N 轮原样保留（1 轮 = user + assistant，含工具块）
  chunkTokens: 40000       # 历史切分块大小
  # 压缩模型链（按优先级，"厂商/别名" ref）：一家失败后切链上下一家不同厂商，
  # 同厂商其余模型不再重试；链尾自动追加当前转发目标兜底（fallbackToTarget）
  target: [bailian/glm-5, volcengine/glm-5.3-flash, kimi/k3]
  fallbackToTarget: true   # 链耗尽前最后落到当前转发目标
  timeoutMs: 400000        # 单次总结请求超时（非流式大块总结，180s 实测不够）
  concurrency: 1           # 分块总结并行度（bailian 等编码端点对并发大块请求限流，建议 1）
  chunkIntervalMs: 2000    # 相邻分块启动间隔，平滑请求速率（上游对速率突增限流）
  skipIfWindowGte: 1000000 # 候选窗口 >= 此值时跳过路由侧压缩（1M 模型由 claude code 自行压缩，降级到 256k 时才压缩）

failover:
  stickyTtlSeconds: 300    # session 粘性 TTL
  failureThreshold: 3      # 连续失败次数触发熔断
  cooldownSeconds: 60      # 熔断冷却
  requestTimeoutMs: 60000  # 单厂商请求超时

storage:
  sqlitePath: ./data/router.db
  jsonlDir: ./data/logs
